summary:
  en: ScentFinder helps people discover their signature fragrance — scan a perfume collection from a photo for tailored recommendations, predict how long a scent will last, test layering combinations and explore scent families on an interactive wheel.
  sr: ScentFinder pomaže ljudima da pronađu svoj prepoznatljiv miris — skeniraj kolekciju parfema sa fotografije za personalizovane preporuke, predvidi koliko će miris trajati, testiraj kombinacije slojevitog nanošenja i istraži porodice mirisa na interaktivnom točku.
