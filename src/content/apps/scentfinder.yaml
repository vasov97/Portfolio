features:
  en:
    - Perfume collection scanner with recommendations and allergen flags
    - Longevity & projection calculator with an hour-by-hour timeline
    - Layering compatibility calculator with a harmony score
    - Interactive scent wheel with top, heart and base notes
    - Personalized perfume quiz
    - Expert tips on concentrations, authenticity and storage
  sr:
    - Skener kolekcije parfema sa preporukama i upozorenjima na alergene
    - Kalkulator trajanja i projekcije sa vremenskom linijom sat po sat
    - Kalkulator kompatibilnosti slojevitog nanošenja sa ocenom harmonije
    - Interaktivni točak mirisa sa gornjim, srednjim i baznim notama
    - Personalizovani kviz za izbor parfema
    - Saveti stručnjaka o koncentracijama, autentičnosti i čuvanju
